  activities:
  - code: routine-data-review
    source_ref: 34
    claim_type: activity
    label: Routine Data Review
    help_text: Systematically reviewing incoming data across all active sites.
  - code: manual-query-generation
    source_ref: 35
    claim_type: activity
    label: Manual Query Generation
    help_text: Issuing targeted, non-leading queries for discrepancies not caught by automated checks.
  - code: query-aging-management
    source_ref: 36
    claim_type: trait
    label: Query Aging Management
    help_text: Chasing sites/CRAs to resolve queries older than 14 or 30 days.
  - code: self-evident-corrections-sec
    source_ref: 37
    claim_type: activity
    label: Self-Evident Corrections (SEC)
    help_text: Applying allowable database corrections without querying the site (per DMP).
  - code: protocol-deviation-data-cleaning
    source_ref: 38
    claim_type: activity
