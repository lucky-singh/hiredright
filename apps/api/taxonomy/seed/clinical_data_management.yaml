role:
  code: clinical-data-management
  label: Clinical Data Management
  description: Database architecture, edit check logic, medical coding, vendor reconciliation, and overall data governance.
competency_areas:
- code: study-start-up-database-build
  label: Study Start-up & Database Build
  activities:
  - code: data-management-plan-dmp
    source_ref: 1
    claim_type: activity
    label: Data Management Plan (DMP)
    help_text: Authoring and maintaining the core strategic document for data collection and cleaning.
  - code: ecrf-specifications-formulation
    source_ref: 2
    claim_type: activity
    label: eCRF Specifications Formulation
    help_text: Translating the clinical protocol into actionable eCRF design specs.
  - code: protocol-review-for-data-collection
    source_ref: 3
    claim_type: activity
    label: Protocol Review for Data Collection
    help_text: Identifying ambiguities in visit schedules or endpoints before database build.
  - code: database-design-architecture
    source_ref: 4
    claim_type: activity
    label: Database Design (Architecture)
    help_text: Structuring folders, visits, and forms sequentially in the EDC.
  - code: data-flow-mapping
    source_ref: 5
    claim_type: activity
    label: Data Flow Mapping
    help_text: Designing the pipeline of how data moves from site to EDC to external vendors to final extraction.
  - code: crf-completion-guidelines-ccgs
    source_ref: 6
    claim_type: activity
    label: CRF Completion Guidelines (CCGs)
    help_text: Writing clear instructions for site staff on how to enter data.
  - code: startup-timeline-management
    source_ref: 7
    claim_type: activity
    label: Startup Timeline Management
    help_text: Driving EDC go-live to meet the First-Patient-In (FPI) milestone.
  - code: sponsorcro-kickoff-facilitation
    source_ref: 8
    claim_type: activity
    label: Sponsor/CRO Kickoff Facilitation
    help_text: Leading the data management portion of study initiation meetings.
  - code: master-library-implementation
    source_ref: 9
    claim_type: activity
    label: Master Library Implementation
    help_text: Utilizing global sponsor libraries for standardized eCRF build.
  - code: study-build-migrations
    source_ref: 10
    claim_type: activity
    label: Study Build Migrations
    help_text: Managing the deployment of database structures from Development to QA to Production.
  - code: randomization-interface-irtiwrs-setup
    source_ref: 11
    claim_type: activity
    label: Randomization Interface (IRT/IWRS) Setup
    help_text: Aligning EDC subject creation with IRT randomization triggers.
- code: ecrf-design-cdash-standards
  label: eCRF Design & CDASH Standards
  activities:
  - code: cdash-mastery
    source_ref: 12
    claim_type: proficiency
    label: CDASH Mastery
    help_text: Strict application of CDISC CDASH standards for variable naming and form layout.
  - code: standard-form-design
    source_ref: 13
    claim_type: activity
    label: Standard Form Design
    help_text: Building robust Demographics, Medical History, AE, and ConMed forms.
  - code: log-line-forms
    source_ref: 14
    claim_type: activity
    label: Log Line Forms
    help_text: Structuring repeating datasets (e.g., dosing logs, ongoing adverse events).
  - code: targeted-sdv-tsdv-setup
    source_ref: 15
    claim_type: activity
    label: Targeted SDV (tSDV) Setup
    help_text: Configuring the EDC to flag specific fields for CRA review based on risk.
  - code: dynamic-ecrf-logic
    source_ref: 16
    claim_type: activity
    label: Dynamic eCRF Logic
    help_text: Building skip logic (e.g., if Sex=Male, hide pregnancy form).
  - code: global-vs-study-specific-naming-conventions
    source_ref: 17
    claim_type: activity
    label: Global vs. Study-Specific Naming Conventions
    help_text: Balancing sponsor standards with unique protocol requirements.
  - code: visual-ecrf-layout
    source_ref: 18
    claim_type: activity
    label: Visual eCRF Layout
    help_text: Optimizing the user interface (UI) of forms to reduce site entry fatigue.
  - code: unit-standardization
    source_ref: 19
    claim_type: activity
    label: Unit Standardization
    help_text: Configuring drop-downs vs. free-text fields to ensure clean lab/vital data.
  - code: eproecoa-design-alignment
    source_ref: 20
    claim_type: activity
    label: ePRO/eCOA Design Alignment
    help_text: Ensuring diary data structure maps seamlessly back to the main EDC database.
  - code: legacy-form-upgrades
    source_ref: 21
    claim_type: activity
    label: Legacy Form Upgrades
    help_text: Modernizing old paper CRF structures into efficient electronic formats.
  - code: cross-form-data-piping
    source_ref: 22
    claim_type: activity
    label: Cross-Form Data Piping
    help_text: Configuring the EDC to auto-populate fields across visits to reduce redundant entry.
- code: edit-check-programming-uat
  label: Edit Check Programming & UAT
  activities:
  - code: data-validation-plan-dvp-creation
    source_ref: 23
    claim_type: activity
    label: Data Validation Plan (DVP) Creation
    help_text: Authoring the comprehensive list of automated edit checks and manual review steps.
  - code: edit-check-logic-writing
    source_ref: 24
    claim_type: activity
    label: Edit Check Logic Writing
    help_text: Translating clinical rules into Boolean logic (e.g., If AE Start Date < Informed Consent Date).
  - code: cross-form-edit-checks
    source_ref: 25
    claim_type: activity
    label: Cross-Form Edit Checks
    help_text: Building rules that check data across different forms (e.g., AE severity vs. ConMed indication).
  - code: custom-function-requirements
    source_ref: 26
    claim_type: activity
    label: Custom Function Requirements
    help_text: Specifying complex derivations that standard edit checks cannot handle.
  - code: user-acceptance-testing-uat-execution
    source_ref: 27
    claim_type: activity
    label: User Acceptance Testing (UAT) Execution
    help_text: Rigorously breaking the database in QA before it goes live.
  - code: uat-script-writing
    source_ref: 28
    claim_type: activity
    label: UAT Script Writing
    help_text: Creating step-by-step test cases for dummy patients covering all edit checks.
  - code: uat-defect-tracking
    source_ref: 29
    claim_type: activity
    label: UAT Defect Tracking
    help_text: Logging and resolving EDC build bugs with the programming team.
  - code: sponsor-uat-management
    source_ref: 30
    claim_type: trait
    label: Sponsor UAT Management
    help_text: Facilitating the client's testing phase and resolving their feedback.
  - code: post-production-change-ppc-management
    source_ref: 31
    claim_type: trait
    label: Post-Production Change (PPC) Management
    help_text: Safely testing and deploying mid-study database amendments.
  - code: automated-query-message-design
    source_ref: 32
    claim_type: activity
    label: Automated Query Message Design
    help_text: Writing clear, non-leading query text for automated edit check firings.
  - code: derivation-programming
    source_ref: 33
    claim_type: activity
    label: Derivation Programming
    help_text: Configuring calculated fields (e.g., BMI, Age at Consent) to calculate automatically.
- code: data-cleaning-query-management
