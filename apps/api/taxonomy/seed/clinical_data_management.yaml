  - code: listing-review
    source_ref: 40
    claim_type: activity
    label: Listing Review
    help_text: Generating and reviewing patient profiles and raw data listings for clinical logic.
  - code: outlier-detection
    source_ref: 41
    claim_type: activity
    label: Outlier Detection
    help_text: Identifying biologically implausible values in vitals or labs.
  - code: duplicate-detection
    source_ref: 42
    claim_type: activity
