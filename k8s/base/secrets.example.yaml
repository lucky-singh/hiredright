apiVersion: v1
kind: Secret
metadata:
  name: hiredright-secrets
type: Opaque
stringData:
  # In production, these should be generated by Terraform or sealed-secrets, not checked into git!
  SECRET_KEY: "your-production-secret-key"
  DEBUG: "False"
  ALLOWED_HOSTS: "api.hiredright.com,www.hiredright.com"
  DATABASE_URL: "postgres://user:pass@host:5432/dbname"
  CELERY_BROKER_URL: "redis://redis-host:6379/0"
  REDIS_URL: "redis://redis-host:6379/1"
  AWS_ACCESS_KEY_ID: "..."
  AWS_SECRET_ACCESS_KEY: "..."
  AWS_STORAGE_BUCKET_NAME: "hiredright-resumes"
