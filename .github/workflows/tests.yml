name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    # Run a postgres, redis, and minio service for Django tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_hiredright
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
      minio:
        image: minio/minio:latest
        ports:
          - 9000:9000
          - 9001:9001
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        command: server /data --console-address ":9001"


    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        working-directory: ./apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov faker
          
      - name: Create MinIO Bucket
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
        run: |
          # Wait for MinIO to be ready and create bucket using aws-cli
          for i in {1..30}; do
            if curl -s http://localhost:9000/minio/health/live; then
              aws --endpoint-url http://localhost:9000 s3 mb s3://hiredright
              break
            fi
            echo "Waiting for MinIO..."
            sleep 1
          done
          
      - name: Run Backend Tests
        working-directory: ./apps/api
        env:
          POSTGRES_DB: test_hiredright
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          SECRET_KEY: test_secret_key
          DEBUG: True
          AWS_S3_ENDPOINT_URL: http://localhost:9000
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          AWS_STORAGE_BUCKET_NAME: hiredright
        run: |
          pytest --cov=. --cov-report=xml

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './apps/web/package-lock.json'
          
      - name: Install dependencies
        working-directory: ./apps/web
        run: npm ci
        
      - name: Run Frontend Tests
        working-directory: ./apps/web
        run: npm run test
